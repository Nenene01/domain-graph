name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  neo4j:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker compose up -d --wait
      - run: npm run test:neo4j
      - if: always()
        run: docker compose down -v

  python-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python contract tests
        run: python3 -m unittest discover -v
      - name: Secret scan hook
        run: rg -n --hidden --glob '!node_modules/**' --glob '!.git/**' '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|password\s*[:=]\s*[^<])' . && exit 1 || true
      - name: IaC skeleton validation hook
        run: python3 deploy/validate_manifest.py deploy/manifest.example.yaml || test $? -eq 1
